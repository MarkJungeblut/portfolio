<a class="skip-link" href="#main">Skip to content</a>
<header class="header">
  <a
    class="logo"
    routerLink="/"
    fragment="home"
    aria-label="Mark Jungeblut, home"
  >
    <ng-container [ngTemplateOutlet]="logo" />
  </a>

  <nav class="nav" aria-label="Main">
    @for (section of sections(); track section.id) {
    <a class="nav-link" routerLink="/" [fragment]="section.id"
      >{{ section.label }}</a
    >
    }
    <a
      class="nav-link"
      routerLink="/impressum"
      routerLinkActive
      ariaCurrentWhenActive="page"
      >Impressum</a
    >
  </nav>

  <button
    class="menu"
    type="button"
    aria-controls="mobile-menu"
    [attr.aria-expanded]="menuOpen()"
    (click)="openMenu()"
  >
    Menu
    <span class="menu-bars" aria-hidden="true">
      <span class="menu-bar menu-bar--long"></span>
      <span class="menu-bar menu-bar--short"></span>
    </span>
  </button>
</header>

<dialog
  #menu
  id="mobile-menu"
  class="mobile-menu"
  aria-label="Menu"
  tabindex="-1"
  (close)="onMenuClose()"
>
  <div class="menu-top">
    <a
      class="logo"
      routerLink="/"
      fragment="home"
      aria-label="Mark Jungeblut, home"
      (click)="closeMenu()"
    >
      <ng-container [ngTemplateOutlet]="logo" />
    </a>
    <button class="menu-close" type="button" (click)="closeMenu()">
      Close <span aria-hidden="true">×</span>
    </button>
  </div>

  <nav class="menu-nav" aria-label="Mobile">
    @for (section of sections(); track section.id) {
    <a
      class="menu-link"
      routerLink="/"
      [fragment]="section.id"
      (click)="closeMenu()"
      ><span class="menu-number" aria-hidden="true"
        >{{ itemNumber($index) }}</span
      >{{ section.label }}</a
    >
    }
  </nav>

  <div class="menu-footer">
    <ul class="menu-socials">
      @for (social of socials(); track social.url) {
      <li>
        <a
          class="menu-footer-link"
          [href]="social.url"
          target="_blank"
          rel="noopener noreferrer"
          (click)="closeMenu()"
          >{{ social.label }}</a
        >
      </li>
      }
    </ul>
    <a class="menu-footer-link" routerLink="/impressum" (click)="closeMenu()"
      >Impressum</a
    >
  </div>
</dialog>
