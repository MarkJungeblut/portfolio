version: 2

updates:
  # Angular and Nx release their packages in lockstep, so each group moves
  # together rather than as a dozen separate PRs that can't pass alone.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    # Nx upgrades go through `nx migrate`, which Dependabot can't run; it only
    # proposes the version bump. TypeScript is capped at what Angular accepts.
    ignore:
      - dependency-name: typescript
        versions: ['>=6.1']
    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - '@angular-eslint/*'
      nx:
        patterns: ['nx', '@nx/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
