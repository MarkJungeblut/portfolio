# Enforces the Definition of Done from docs/guidelines/ai-collaboration.md,
# using the commands recorded in CLAUDE.md. Only projects affected by the
# change are checked; nx-set-shas gives `affected` its base commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Definition of Done
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Build, typecheck, test, lint
        run: npx nx affected -t build typecheck test lint

      - name: Format check
        run: npx nx format:check
