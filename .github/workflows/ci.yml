# Enforces the Definition of Done from docs/guidelines/ai-collaboration.md,
# using the commands recorded in CLAUDE.md. Only projects affected by the
# change are checked; nx-set-shas gives `affected` its base commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # nx-set-shas looks up the last successful run on main for `affected`.
  actions: read

jobs:
  check:
    name: Build and Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@v4

      - name: Build, typecheck, test, lint
        run: npx nx affected -t build typecheck lint

      # Not `affected`: lib tests borrow the app's build config, but libs don't
      # depend on the app, so an app change would skip them. The cache keeps
      # unchanged projects cheap.
      - name: Test
        run: npx nx run-many -t test

      - name: Format check
        run: npx nx format:check
